# One deployment: API Worker + Astro's pre-rendered static assets.
# Keep the existing Worker name and database to preserve secrets and data.
name = "cryptdrop-server"
main = "backend/src/index.ts"
compatibility_date = "2025-03-01"

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
run_worker_first = ["/api", "/api/*"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "cryptdrop-db"
database_id = "c0a47e3e-6cc4-477a-8df4-03c553f21db6"
migrations_dir = "backend/migrations"

[vars]
# Set this to the final public frontend origin before switching production traffic.
SITE_URL = "https://cryptdrop-site.pages.dev"

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
